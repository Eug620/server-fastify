<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/siam.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝日常记录</title>
</head>
<style>
    /* ==================== CSS 变量（可配置主题） ==================== */
    :root {
        /* 背景色 */
        --bg-primary: #272727;           /* 主背景色 */
        --bg-secondary: #1e1e1e;         /* 次级背景色（顶部栏） */
        --bg-tertiary: #2a2a2a;          /* 三级背景色（标签页） */
        /* 主题色 */
        --accent: #4ECDC4;               /* 主题强调色 */
        /* 文字颜色 */
        --text-primary: #fff;            /* 主文字颜色 */
        --text-secondary: rgba(255, 255, 255, 0.5);  /* 次级文字颜色 */
        --text-muted: #888;              /* 弱化文字颜色 */
        /* 边框颜色 */
        --border: #333;                  /* 边框色 */
        --border-light: rgba(255, 255, 255, 0.1);  /** 浅边框色（列表项，深色适配） */
        --border-list: rgba(255, 255, 255, 0.15);  /** 列表边框色（深色适配） */
        /* 卡片颜色 */
        --card-bg: rgba(255, 255, 255, 0.1);  /* 卡片背景色 */
        /* 弹窗颜色（深色主题） */
        --modal-bg: #1e1e1e;                /** 弹窗背景色（深色） */
        --modal-text: #fff;                  /** 弹窗主文字颜色 */
        --modal-muted: rgba(255, 255, 255, 0.5);  /** 弹窗弱化文字颜色 */
        --modal-border: rgba(255, 255, 255, 0.1); /** 弹窗边框颜色 */
        /* 按钮颜色（深色主题） */
        --btn-cancel-bg: rgba(255, 255, 255, 0.1);  /** 取消按钮背景色 */
        --btn-cancel-text: rgba(255, 255, 255, 0.7); /** 取消按钮文字颜色 */
        --btn-confirm-bg: var(--accent);      /** 确认按钮背景色 */
        --btn-confirm-text: #fff;            /** 确认按钮文字颜色 */
        --btn-danger: #e74c3c;               /** 危险操作颜色（删除） */
        /* 阴影 */
        --shadow-light: 0 2px 6px rgba(0, 0, 0, 0.15);   /* 轻阴影 */
        --shadow-medium: 0 8px 20px rgba(0, 0, 0, 0.35);  /* 中阴影 */
        /* 图片查看器 */
        --viewer-bg: rgba(0, 0, 0, 0.9);  /* 图片查看器背景 */
        --viewer-control-bg: rgba(255, 255, 255, 0.2);  /* 控件背景色 */
        --viewer-control-hover: rgba(255, 255, 255, 0.3);  /* 控件悬停色 */
        --viewer-zoom-text: rgba(255, 255, 255, 0.7);    /* 缩放提示文字色 */
        /* 标签页悬停 */
        --tab-hover-bg: #333;            /* 标签页悬停背景 */
        --tab-hover-text: #ccc;          /* 标签页悬停文字 */
        /* 输入框（深色主题） */
        --input-border: rgba(255, 255, 255, 0.2);  /** 输入框边框色 */
        --input-bg: rgba(255, 255, 255, 0.05);    /** 输入框背景色 */
        --input-text: rgba(255, 255, 255, 0.9);   /** 输入框文字颜色 */
        --input-label: rgba(255, 255, 255, 0.6);  /** 输入框标签颜色 */
        /* Toast */
        --toast-bg: rgba(0, 0, 0, 0.75);  /* Toast 背景色 */
        /* 上传按钮 */
        --upload-border: rgba(255, 255, 255, 0.2);  /** 上传区域边框色 */
        --upload-border-hover: var(--accent);         /** 上传区域悬停边框色 */
        --upload-bg: rgba(255, 255, 255, 0.03);     /** 上传区域背景色 */
        --upload-text: rgba(255, 255, 255, 0.5);    /** 上传区域提示文字色 */
        --upload-icon: rgba(255, 255, 255, 0.3);    /** 上传区域图标色 */
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: var(--bg-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
    }

    /* ==================== Canvas ==================== */
    canvas {
        width: 100dvw;
        height: 50dvw;
        position: fixed;
        bottom: 0;
        left: 0;
        touch-action: none;
    }

    /* ==================== Toast 提示 ==================== */
    .toast {
        position: fixed;
        top: 60px;
        left: 50%;
        transform: translateX(-50%) translateY(-20px);
        background: var(--toast-bg);
        color: var(--text-primary);
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
        z-index: 1000;
        pointer-events: none;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* ==================== 卡片列表 ==================== */
    .card-list {
        overflow-y: auto;
        padding: 60px 16px 16px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        align-content: start;
    }

    .card {
        border-radius: 14px;
        padding: 14px 12px;
        display: flex;
        flex-direction: column;
        align-items: start;
        justify-content: center;
        gap: 6px;
        font-weight: 600;
        box-shadow: var(--shadow-light);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        cursor: pointer;
        min-height: 80px;
        background-color: var(--card-bg);
    }

    .card__title {
        font-size: 14px;
        opacity: 0.9;
        color: var(--text-secondary);
    }

    .card__count {
        font-size: 12px;
        line-height: 1;
        color: var(--text-secondary);
    }

    /* ==================== 通用弹窗遮罩 ==================== */
    .modal-mask {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
    }

    .modal-mask.show {
        display: flex;
    }

    .modal {
        background: var(--modal-bg);
        border-radius: 14px;
        padding: 20px;
        width: 300px;
        max-width: 90vw;
    }

    .modal__title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        text-align: center;
        color: var(--modal-text);
    }

    .modal__body {
        min-height: 40px;
    }

    .modal__footer {
        display: flex;
        gap: 10px;
        margin-top: 8px;
    }

    .modal__footer button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
    }

    .btn-cancel {
        background: var(--btn-cancel-bg);
        color: var(--btn-cancel-text);
    }

    .btn-confirm {
        background: var(--btn-confirm-bg);
        color: var(--btn-confirm-text);
    }

    /* ==================== 表单字段 ==================== */
    .form-field {
        margin-bottom: 16px;
    }

    .form-field label {
        display: block;
        font-size: 13px;
        color: var(--input-label);
        margin-bottom: 10px;
        font-weight: 500;
    }

    /* 带单位的输入框容器 */
    .input-with-unit {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-with-unit input[type=number] {
        width: 100%;
        padding: 12px 50px 12px 16px;
        border: 1px solid var(--input-border);
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
        background: var(--input-bg);
        color: var(--input-text);
        transition: all 0.25s ease;
    }

    .input-with-unit input[type=number]:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.15);
    }

    /* 单位后缀 */
    .input-unit {
        position: absolute;
        right: 16px;
        color: var(--input-label);
        font-size: 14px;
        pointer-events: none;
        user-select: none;
    }

    /* 普通输入框样式（兼容旧版） */
    .form-field input[type=number] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
        background: var(--input-bg);
        color: var(--input-text);
        transition: border-color 0.2s, background 0.2s;
    }

    .form-field input[type=number]:focus {
        outline: none;
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.08);
    }

    /* ==================== 上传按钮 ==================== */
    .upload-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .upload-wrapper input[type=file] {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
        z-index: 1;
    }

    .upload-area {
        width: 100%;
        min-height: 120px;
        padding: 20px;
        border: 2px dashed var(--upload-border);
        border-radius: 12px;
        background: var(--upload-bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .upload-area:hover {
        border-color: var(--upload-border-hover);
        background: rgba(78, 205, 196, 0.05);
    }

    .upload-area.has-image {
        border-style: solid;
        border-color: var(--accent);
        padding: 12px;
    }

    .upload-icon {
        width: 32px;
        height: 32px;
        color: var(--upload-icon);
        transition: color 0.2s;
    }

    .upload-area:hover .upload-icon {
        color: var(--accent);
    }

    .upload-text {
        font-size: 13px;
        color: var(--upload-text);
        text-align: center;
    }

    .upload-area:hover .upload-text {
        color: var(--accent);
    }

    .form-preview {
        max-width: 100%;
        max-height: 200px;
        border-radius: 8px;
        display: none;
        margin: 0 auto;
    }

    /* ==================== 日期 Tab 栏 ==================== */
    .date-tabs {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        background: var(--bg-secondary);
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
        z-index: 500;
        border-bottom: 1px solid var(--border);
    }

    .date-tabs::-webkit-scrollbar {
        display: none;
    }

    .date-tabs__list {
        display: flex;
        padding: 0 8px;
        gap: 6px;
    }

    .date-tab {
        flex-shrink: 0;
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 13px;
        color: var(--text-muted);
        background: var(--bg-tertiary);
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }

    .date-tab:hover {
        background: var(--tab-hover-bg);
        color: var(--tab-hover-text);
    }

    .date-tab.active {
        background: var(--accent);
        color: var(--text-primary);
        font-weight: 600;
    }

    /* ==================== 数据列表弹窗 ==================== */
    .list-modal {
        width: 340px;
        max-width: 90vw;
        max-height: 70vh;
        display: flex;
        flex-direction: column;
    }

    .list-modal__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-list);
        margin-bottom: 12px;
    }

    .list-modal__title {
        font-size: 16px;
        font-weight: 600;
        color: var(--modal-text);
    }

    .list-modal__close {
        background: none;
        border: none;
        font-size: 20px;
        color: var(--modal-muted);
        cursor: pointer;
        padding: 0;
        line-height: 1;
    }

    .list-modal__content {
        flex: 1;
        overflow-y: auto;
    }

    .list-item {
        display: flex;
        align-items: flex-start;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-light);
    }

    .list-item:last-child {
        border-bottom: none;
    }

    .list-item__time {
        font-size: 12px;
        color: var(--modal-muted);
        min-width: 70px;
        padding-top: 2px;
    }

    .list-item__content {
        flex: 1;
        margin-left: 10px;
    }

    .list-item__value {
        font-size: 14px;
        color: var(--modal-text);
    }

    .list-item__img {
        max-width: 120px;
        max-height: 120px;
        border-radius: 8px;
        margin-top: 4px;
        cursor: zoom-in;
    }

    .list-item__empty {
        font-size: 13px;
        color: var(--text-muted);
        padding-top: 4px;
    }

    .list-empty {
        text-align: center;
        color: var(--text-muted);
        padding: 40px 0;
        font-size: 14px;
    }

    /* ==================== 图片查看器 ==================== */
    .img-viewer {
        position: fixed;
        inset: 0;
        background: var(--viewer-bg);
        display: none;
        z-index: 3000;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        touch-action: none;
    }

    .img-viewer.show {
        display: flex;
    }

    .img-viewer__close {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        background: var(--viewer-control-bg);
        border: none;
        border-radius: 50%;
        color: var(--text-primary);
        font-size: 24px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 3001;
    }

    .img-viewer__close:hover {
        background: var(--viewer-control-hover);
    }

    .img-viewer__zoom-controls {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 12px;
        z-index: 3001;
    }

    .img-viewer__zoom-btn {
        width: 44px;
        height: 44px;
        background: var(--viewer-control-bg);
        border: none;
        border-radius: 50%;
        color: var(--text-primary);
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .img-viewer__zoom-btn:hover {
        background: var(--viewer-control-hover);
    }

    .img-viewer__zoom-level {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: var(--viewer-zoom-text);
        font-size: 14px;
        z-index: 3001;
    }

    .img-viewer__img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        transition: transform 0.1s ease-out;
        transform-origin: center center;
        cursor: grab;
    }

    .img-viewer__img.dragging {
        cursor: grabbing;
        transition: none;
    }
</style>

<body>
    <div class="date-tabs" id="dateTabs">
        <div class="date-tabs__list" id="dateTabsList"></div>
    </div>
    <div class="card-list" id="cardList"></div>

    <canvas id="cvs"></canvas>
    <div class="toast" id="toast"></div>

    <!-- 输入弹窗 -->
    <div class="modal-mask" id="inputModal">
        <div class="modal">
            <div class="modal__title" id="inputModalTitle"></div>
            <div class="modal__body" id="inputModalBody"></div>
            <div class="modal__footer">
                <button class="btn-cancel" id="inputModalCancel">取消</button>
                <button class="btn-confirm" id="inputModalConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 数据列表弹窗 -->
    <div class="modal-mask" id="listModal">
        <div class="modal list-modal">
            <div class="list-modal__header">
                <div class="list-modal__title" id="listModalTitle"></div>
                <button class="list-modal__close" id="listModalClose">×</button>
            </div>
            <div class="list-modal__content" id="listModalContent"></div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="img-viewer" id="imgViewer">
        <button class="img-viewer__close" id="imgViewerClose">×</button>
        <img class="img-viewer__img" id="imgViewerImg" alt="预览图片">
        <div class="img-viewer__zoom-level" id="imgViewerZoomLevel">100%</div>
        <div class="img-viewer__zoom-controls">
            <button class="img-viewer__zoom-btn" id="zoomOut">−</button>
            <button class="img-viewer__zoom-btn" id="zoomReset">1:1</button>
            <button class="img-viewer__zoom-btn" id="zoomIn">+</button>
        </div>
    </div>

    <script>
        /**
         * @file 宝宝日常记录 - 前端主逻辑
         * @description 包含转盘绘制、数据管理、图片查看等功能
         */

        /* ==================== 全局配置（可修改） ==================== */

        /**
         * 应用配置对象
         * @description 所有可调整的参数都集中在此处
         */
        const AppConfig = {
            /** Canvas 绘制相关配置 */
            canvas: {
                aspectRatio: 0.5,         /** 画布高度/宽度比例 */
                duration: 450,            /** 动画时长（毫秒） */
                swipeThreshold: 30,       /** 滑动判定阈值（像素） */
                tapThreshold: 15,         /** 点击判定阈值（像素） */
                labelRadiusRatio: 0.62,   /** 标签半径占比（相对于外半径） */
                labelFontRatio: 0.11,     /** 标签字体大小占比（相对于外半径） */
                btnRadiusRatio: 0.48,     /** 按钮半径占比（相对于外半径） */
                btnFontRatio: 0.6,        /** 按钮字体大小占比（相对于按钮半径） */
                btnHitTolerance: 10,      /** 按钮点击容差（像素） */
                innerRadiusRatio: 0.52,   /** 圆心空白大小（内半径占外半径的比例） */
                sectorGap: 8,             /** 扇形间距（像素，等宽） */
                shadow: {
                    btn: { color: 'rgba(0,0,0,0.35)', blur: 20, offsetY: -6 }, /** 按钮阴影配置 */
                },
                colors: {
                    center: '#272727',           /** 按钮中心渐变起始色 */
                    centerDark: '#272727',       /** 按钮中心渐变结束色 */
                    btnText: '#7d7d7f',          /** 按钮文字颜色 */
                    btnStroke: 'rgba(0,0,0,0.1)', /** 按钮边框颜色 */
                    labelActive: 'rgba(255,255,255,1)', /** 选中扇形标签颜色 */
                    labelInactive: 'rgba(255,255,255,0.5)', /** 未选中扇形标签颜色 */
                },
            },
            /** 卡片网格配置 */
            grid: {
                columns: 4, /** 网格列数 */
                gap: 12,    /** 卡片间距（像素） */
            },
            /** 图片查看器配置 */
            viewer: {
                minScale: 0.5,  /** 最小缩放比例 */
                maxScale: 5,    /** 最大缩放比例 */
                scaleStep: 0.25, /** 每次缩放步长 */
            },
        };

        /* ==================== 数据配置 ==================== */

        /**
         * 记录类型配置
         * @type {Array<{type: string, label: string, color: string, options: Array<{key: string, label: string}>}>}
         * @description 定义转盘扇形和卡片的类型配置
         * - type: 类型标识符，用于数据存储
         * - label: 显示的中文标签
         * - color: 扇形和卡片的背景色（RGBA格式）
         * - options: 该类型的输入字段配置
         *   - key: 字段键名（如 'ml', 'img', 'h'）
         *   - label: 字段标签（单位等）
         */
        const options = [
            { type: 'wn', label: '喂奶', color: 'rgba(255,138,128,0.5)', options: [{ key: 'ml', label: 'ml' }] },     // 暖粉：奶的温暖感
            { type: 'hs', label: '喝水', color: 'rgba(79,165,255,0.5)', options: [{ key: 'ml', label: 'ml' }] },     // 蓝色：水的清澈感
            { type: 'db', label: '大便', color: 'rgba(139,98,58,0.5)', options: [{ key: 'img', label: 'img' }] },    // 棕色：大便的颜色
            { type: 'xb', label: '小便', color: 'rgba(255,206,86,0.5)', options: [{ key: 'img', label: 'img' }]},    // 黄色：小便的颜色
            { type: 'sj', label: '睡觉', color: 'rgba(149,117,205,0.5)', options: [{ key: 'h', label: 'h' }] },      // 紫色：睡眠的夜晚感
        ];

        /** @type {Array<Object>} 当前加载的记录数据 */
        let values = [];

        /* ==================== API 接口 ==================== */

        /**
         * 通用请求方法
         * @param {string} url - 请求URL
         * @param {Object|null} options - fetch请求配置（method, headers, body等）
         * @param {string} defaultMsg - 请求失败时的默认错误信息
         * @returns {Promise<any>} 响应数据中的data字段
         * @throws {Error} 当请求失败或返回非0错误码时抛出异常
         */
        async function request(url, options, defaultMsg) {
            const res = await fetch(url, options);
            let json;
            try { json = await res.json(); } catch { throw new Error(defaultMsg); }
            if (json.code !== 0) throw new Error(json.message || defaultMsg);
            return json.data;
        }

        /**
         * API 接口集合
         * @description 封装所有后端接口调用
         */
        const API = {
            /**
             * 获取记录列表
             * @param {string} [date] - 可选，按日期筛选（格式：MM/DD）
             * @returns {Promise<Array<Object>>} 记录列表
             */
            list(date) {
                const url = date ? `/api/records?date=${encodeURIComponent(date)}` : '/api/records';
                return request(url, null, '加载数据失败');
            },

            /**
             * 创建新记录
             * @param {Object} data - 记录数据
             * @param {string} data.type - 记录类型标识符
             * @param {number} data.timestamp - 时间戳
             * @param {string} [data.ml] - 毫升数（喂奶/喝水）
             * @param {string} [data.h] - 小时数（睡觉）
             * @param {string} [data.img] - 图片URL
             * @returns {Promise<Object>} 创建的记录
             */
            create(data) {
                return request('/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data),
                }, '创建记录失败');
            },

            /**
             * 删除指定记录
             * @param {string} id - 记录ID
             * @returns {Promise<void>}
             */
            remove(id) {
                return request(`/api/records/${id}`, { method: 'DELETE' }, '删除记录失败');
            },

            /**
             * 清空所有记录
             * @returns {Promise<void>}
             */
            clear() {
                return request('/api/records', { method: 'DELETE' }, '清空记录失败');
            },

            /**
             * 上传图片文件
             * @param {File} file - 图片文件对象
             * @returns {Promise<string>} 上传后的图片URL
             */
            async upload(file) {
                const formData = new FormData();
                formData.append('file', file);
                const url = '/api/upload';
                const res = await fetch(url, { method: 'POST', body: formData });
                let json;
                try { json = await res.json(); } catch { throw new Error('文件上传失败'); }
                if (json.code !== 0) throw new Error(json.message || '文件上传失败');
                return json.data.url;
            }
        };

        /**
         * 加载所有记录数据
         * @description 从API获取最新数据，失败时显示错误提示
         * @returns {Promise<void>}
         */
        async function loadData() {
            try {
                values = await API.list();
            } catch (e) {
                showToast(e.message || '加载数据失败');
                values = [];
            }
        }

        /**
         * 刷新所有界面数据
         * @param {string} [dateStr] - 可选，指定刷新的日期
         * @returns {Promise<void>}
         */
        async function refreshAll(dateStr) {
            await loadData();
            if (dateStr) state.selectedDate = dateStr;
            renderDateTabs();
            renderCards();
        }

        /* ==================== 常量 ==================== */

        /** @type {number} 半圆角度值 */
        const HALF_PI = Math.PI / 2;
        /** @type {number} 全圆角度值 */
        const TAU = Math.PI * 2;

        /** @description 配置快捷引用 */
        const { canvas: CC, grid, viewer } = AppConfig;

        /* ==================== DOM 引用 ==================== */

        /**
         * 获取DOM元素快捷方法
         * @param {string} id - 元素ID
         * @returns {HTMLElement} DOM元素
         */
        const $ = id => document.getElementById(id);

        /** @type {HTMLCanvasElement} 画布元素 */
        const canvas = $('cvs');
        /** @type {CanvasRenderingContext2D} 画布2D上下文 */
        const ctx = canvas.getContext('2d');

        /* ==================== 状态管理 ==================== */

        /**
         * 全局状态对象
         * @description 存储所有可变状态
         */
        const state = {
            /** Canvas 绘制状态 */
            centerX: 0,      /** 画布中心点X坐标 */
            centerY: 0,      /** 画布中心点Y坐标 */
            radius: 0,       /** 转盘外半径 */
            btnRadius: 0,    /** 中心按钮半径 */
            activeIndex: 0,  /** 当前选中的扇形索引 */
            rotation: 0,     /** 当前旋转角度 */
            animFrom: 0,     /** 动画起始角度 */
            animStart: null,  /** 动画开始时间戳 */
            animating: false, /** 是否正在播放动画 */
            startX: 0,       /** 触摸起始X坐标 */
            startY: 0,       /** 触摸起始Y坐标 */
            tracking: false, /** 是否正在追踪触摸 */

            /** 业务状态 */
            selectedDate: null, /** 当前选中的日期（MM/DD格式） */
            currentOption: null, /** 当前操作的记录类型配置 */

            /** 图片查看器状态 */
            viewer: {
                scale: 1,          /** 当前缩放比例 */
                translateX: 0,     /** X轴偏移量 */
                translateY: 0,     /** Y轴偏移量 */
                isDragging: false, /** 是否正在拖拽 */
                isPinching: false,/** 是否正在双指缩放 */
                startX: 0,         /** 拖拽起始X坐标 */
                startY: 0,         /** 拖拽起始Y坐标 */
                pinchDist: 0,      /** 双指初始距离 */
                pinchScale: 1,     /** 双指缩放初始比例 */
            },
        };

        /** @type {number} 扇形总数 */
        const sectorCount = options.length;
        /** @type {number} 每个扇形的角度（弧度） */
        const sectorAngle = TAU / sectorCount;

        /* ==================== 工具函数库 ==================== */

        /**
         * 带阴影绘制函数
         * @param {Object} shadow - 阴影配置对象
         * @param {string} shadow.color - 阴影颜色
         * @param {number} shadow.blur - 阴影模糊半径
         * @param {number} [shadow.offsetX=0] - 阴影X偏移
         * @param {number} [shadow.offsetY=0] - 阴影Y偏移
         * @param {Function} drawFn - 实际绘制函数
         */
        function withShadow(shadow, drawFn) {
            ctx.save();
            ctx.shadowColor = shadow.color;
            ctx.shadowBlur = shadow.blur;
            ctx.shadowOffsetX = shadow.offsetX || 0;
            ctx.shadowOffsetY = shadow.offsetY || 0;
            drawFn();
            ctx.restore();
        }

        /**
         * 绘制扇形路径（支持内半径、等宽间距）
         * @param {number} cx - 圆心X坐标
         * @param {number} cy - 圆心Y坐标
         * @param {number} outerR - 外半径
         * @param {number} startAngle - 起始角度（弧度）
         * @param {number} endAngle - 结束角度（弧度）
         * @param {number} innerR - 内半径（0表示实心扇形）
         * @description 等宽间距：内外边缘按像素分别计算角度偏移，保证间距宽度一致
         */
        function drawArc(cx, cy, outerR, startAngle, endAngle, innerR) {
            const gap = CC.sectorGap;

            // 如果内半径太小，绘制实心扇形
            const isRing = innerR > 1;
            const effectiveInnerR = isRing ? innerR : 0;

            // 等宽间距：内外边缘按像素分别计算角度偏移
            const outerHalfAngle = gap / outerR / 2;
            const innerHalfAngle = isRing ? gap / effectiveInnerR / 2 : 0;

            const outerStart = startAngle + outerHalfAngle;
            const outerEnd = endAngle - outerHalfAngle;
            const angleDiff = outerEnd - outerStart;

            if (angleDiff <= 0) return;

            ctx.beginPath();
            if (isRing) {
                const innerStart = startAngle + innerHalfAngle;
                const innerEnd = endAngle - innerHalfAngle;

                // 1. 外弧
                ctx.arc(cx, cy, outerR, outerStart, outerEnd, false);
                // 2. 直线到内弧终点
                ctx.lineTo(cx + Math.cos(innerEnd) * effectiveInnerR, cy + Math.sin(innerEnd) * effectiveInnerR);
                // 3. 内弧（反向）
                ctx.arc(cx, cy, effectiveInnerR, innerEnd, innerStart, true);
                // 4. 直线回到外弧起点
                ctx.closePath();
            } else {
                // 实心扇形
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, outerR, outerStart, outerEnd, false);
                ctx.closePath();
            }
        }

        /**
         * 绘制居中文字
         * @param {string} text - 要绘制的文字
         * @param {number} x - 文字中心X坐标
         * @param {number} y - 文字中心Y坐标
         * @param {string} font - 字体设置（如 '600 24px sans-serif'）
         * @param {string} color - 文字颜色
         */
        function drawText(text, x, y, font, color) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = font;
            ctx.fillStyle = color;
            ctx.fillText(text, x, y);
        }

        /**
         * 将客户端坐标转换为画布坐标
         * @param {number} clientX - 客户端X坐标（相对于视口）
         * @param {number} clientY - 客户端Y坐标（相对于视口）
         * @returns {{x: number, y: number}} 画布坐标
         */
        function toCanvasPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height),
            };
        }

        /**
         * 显示Toast提示
         * @param {string} message - 提示消息内容
         */
        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        /**
         * 打开指定弹窗
         * @param {string} id - 弹窗元素ID
         */
        function openModal(id) { $(id).classList.add('show'); }

        /**
         * 关闭指定弹窗
         * @param {string} id - 弹窗元素ID
         */
        function closeModal(id) { $(id).classList.remove('show'); }

        /**
         * 格式化时间戳为日期字符串（MM/DD格式）
         * @param {number} ts - 时间戳（毫秒）
         * @returns {string} 格式化后的日期
         */
        function formatDate(ts) {
            const d = new Date(ts);
            return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
        }

        /**
         * 格式化时间戳为时间字符串（hh:mm:ss格式）
         * @param {number} ts - 时间戳（毫秒）
         * @returns {string} 格式化后的时间
         */
        function formatTime(ts) {
            const d = new Date(ts);
            const p = n => String(n).padStart(2, '0');
            return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
        }

        /**
         * 判断时间戳是否属于指定日期
         * @param {number} ts - 时间戳（毫秒）
         * @param {string} dateStr - 日期字符串（MM/DD格式）
         * @returns {boolean} 是否属于该日期
         */
        function isDate(ts, dateStr) {
            return formatDate(ts) === dateStr;
        }

        /**
         * 获取今日日期字符串
         * @returns {string} 今日日期（MM/DD格式）
         */
        function todayStr() {
            return formatDate(Date.now());
        }

        /**
         * 创建DOM元素
         * @param {string} tag - 标签名（如 'div', 'span'）
         * @param {string} [className] - CSS类名
         * @param {string} [text] - 文本内容
         * @returns {HTMLElement} 创建的元素
         */
        function createEl(tag, className, text) {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text !== undefined) el.textContent = text;
            return el;
        }

        /**
         * 创建带点击事件的DOM元素
         * @param {string} tag - 标签名
         * @param {string} [className] - CSS类名
         * @param {Function} [onClick] - 点击事件处理函数
         * @returns {HTMLElement} 创建的元素
         */
        function createClickable(tag, className, onClick) {
            const el = createEl(tag, className);
            if (onClick) el.addEventListener('click', onClick);
            return el;
        }

        /* ==================== Canvas 绘制 ==================== */

        /**
         * 重绘整个画布
         * @description 清空画布后依次绘制扇形和中心按钮
         */
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSectors();
            drawSemicircleButton();
        }

        /**
         * 绘制所有扇形
         * @description 根据选中索引高亮当前扇形
         */
        function drawSectors() {
            const highlight = getCurrentIndex();
            const innerR = state.radius * CC.innerRadiusRatio;
            for (let i = 0; i < sectorCount; i++) {
                const start = (i - 0.5) * sectorAngle - HALF_PI + state.rotation;
                const end = start + sectorAngle;

                drawArc(state.centerX, state.centerY, state.radius, start, end, innerR);
                ctx.fillStyle = options[i].color;
                ctx.fill();

                drawSectorLabel(start, options[i].label, i === highlight);
            }
        }

        /**
         * 绘制扇形上的标签文字
         * @param {number} start - 扇形起始角度（弧度）
         * @param {string} label - 标签文字内容
         * @param {boolean} isActive - 是否为选中状态
         */
        function drawSectorLabel(start, label, isActive) {
            const midAngle = start + sectorAngle / 2;
            const r = state.radius * CC.labelRadiusRatio;
            const tx = state.centerX + Math.cos(midAngle) * r;
            const ty = state.centerY + Math.sin(midAngle) * r - state.radius * CC.labelFontRatio;
            const fontSize = Math.round(state.radius * CC.labelFontRatio);

            drawText(label, tx, ty, `600 ${fontSize}px sans-serif`,
                isActive ? CC.colors.labelActive : CC.colors.labelInactive);
        }

        /**
         * 绘制中心半圆按钮
         * @description 包含按钮背景（带阴影和渐变）、边框和文字
         */
        function drawSemicircleButton() {
            state.btnRadius = state.radius * CC.btnRadiusRatio;
            const { centerX: cx, centerY: cy, btnRadius: br } = state;

            // 按钮背景
            withShadow(CC.shadow.btn, () => {
                ctx.beginPath();
                ctx.arc(cx, cy, br, Math.PI, TAU, false);
                ctx.closePath();
                const grad = ctx.createLinearGradient(cx - br, cy - br, cx + br, cy);
                grad.addColorStop(0, CC.colors.center);
                grad.addColorStop(1, CC.colors.centerDark);
                ctx.fillStyle = grad;
                ctx.fill();
            });

            // 边框
            ctx.lineWidth = 2;
            ctx.strokeStyle = CC.colors.btnStroke;
            ctx.beginPath();
            ctx.arc(cx, cy, br, Math.PI, TAU, false);
            ctx.stroke();

            // 文字
            const fontSize = Math.round(br * CC.btnFontRatio);
            drawText('+', cx, cy - br * 0.35, `bold ${fontSize}px sans-serif`, CC.colors.btnText);
        }

        /**
         * 获取当前选中的扇形索引
         * @returns {number} 索引值（0 到 sectorCount-1）
         */
        function getCurrentIndex() {
            return ((state.activeIndex % sectorCount) + sectorCount) % sectorCount;
        }

        /* ==================== 动画 ==================== */

        /**
         * 缓动函数（ease-out cubic）
         * @param {number} t - 进度值（0 到 1）
         * @returns {number} 缓动后的值
         */
        const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

        /**
         * 动画帧回调
         * @param {number} ts - 当前时间戳
         */
        function animate(ts) {
            if (state.animStart === null) state.animStart = ts;
            const t = Math.min((ts - state.animStart) / CC.duration, 1);
            state.rotation = state.animFrom + (-state.activeIndex * sectorAngle - state.animFrom) * easeOutCubic(t);
            draw();
            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                state.rotation = -state.activeIndex * sectorAngle;
                state.animating = false;
            }
        }

        /**
         * 旋转转盘到指定方向
         * @param {number} delta - 旋转方向（1为顺时针，-1为逆时针）
         */
        function rotateTo(delta) {
            if (delta === 0) return;
            state.activeIndex += delta;
            state.animFrom = state.rotation;
            state.animStart = null;
            if (!state.animating) {
                state.animating = true;
                requestAnimationFrame(animate);
            }
        }

        /* ==================== 交互 ==================== */

        /**
         * 判断点是否在中心按钮内
         * @param {{x: number, y: number}} pt - 画布坐标点
         * @returns {boolean} 是否在按钮范围内
         */
        function isInsideButton(pt) {
            const dist = Math.hypot(pt.x - state.centerX, pt.y - state.centerY);
            return dist <= state.btnRadius + CC.btnHitTolerance && pt.y <= state.centerY;
        }

        /**
         * 指针按下事件处理
         * @param {PointerEvent} e - 指针事件
         */
        function onPointerDown(e) {
            state.startX = e.clientX;
            state.startY = e.clientY;
            state.tracking = true;
            canvas.setPointerCapture(e.pointerId);
        }

        /**
         * 指针抬起事件处理
         * @param {PointerEvent} e - 指针事件
         */
        function onPointerUp(e) {
            if (!state.tracking) return;
            state.tracking = false;
            const dx = e.clientX - state.startX;
            const dy = e.clientY - state.startY;

            const isTap = Math.abs(dx) < CC.tapThreshold && Math.abs(dy) < CC.tapThreshold;
            if (isTap && isInsideButton(toCanvasPoint(e.clientX, e.clientY))) {
                openInputDialog(options[getCurrentIndex()]);
                return;
            }

            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > CC.swipeThreshold) {
                rotateTo(dx < 0 ? 1 : -1);
            }
        }

        canvas.addEventListener('pointerdown', onPointerDown);
        canvas.addEventListener('pointerup', onPointerUp);
        canvas.addEventListener('pointercancel', () => { state.tracking = false; });

        /* ==================== 日期 Tab ==================== */

        /**
         * 获取所有可用的日期列表
         * @returns {string[]} 排序后的日期数组（MM/DD格式）
         */
        function getAllDates() {
            const dates = new Set([todayStr()]);
            values.forEach(v => dates.add(formatDate(v.timestamp)));
            return Array.from(dates).sort((a, b) => {
                const [ma, da] = a.split('/').map(Number);
                const [mb, db] = b.split('/').map(Number);
                return mb * 100 + db - (ma * 100 + da);
            });
        }

        /**
         * 渲染日期选项卡
         * @description 根据所有可用日期渲染可点击的选项卡
         */
        function renderDateTabs() {
            const dates = getAllDates();
            const list = $('dateTabsList');
            list.innerHTML = '';
            if (!state.selectedDate) state.selectedDate = todayStr();

            dates.forEach(date => {
                const tab = createClickable('div', 'date-tab' + (date === state.selectedDate ? ' active' : ''), () => {
                    state.selectedDate = date;
                    renderDateTabs();
                    renderCards();
                });
                tab.textContent = date;
                list.appendChild(tab);
            });

            const activeTab = list.querySelector('.date-tab.active');
            if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        /* ==================== 卡片列表 ==================== */

        /**
         * 获取指定日期各类型记录的数量统计
         * @param {string} dateStr - 日期字符串（MM/DD格式）
         * @returns {Object} 各类型的数量统计对象
         */
        function getDateCounts(dateStr) {
            const counts = {};
            options.forEach(opt => { counts[opt.type] = 0; });
            values.forEach(v => {
                if (isDate(v.timestamp, dateStr)) {
                    counts[v.type] = (counts[v.type] || 0) + 1;
                }
            });
            return counts;
        }

        /**
         * 渲染卡片列表
         * @description 显示当前选中日期的各类型记录统计
         */
        function renderCards() {
            const dateStr = state.selectedDate || todayStr();
            const counts = getDateCounts(dateStr);
            const list = $('cardList');
            list.style.gridTemplateColumns = `repeat(${grid.columns}, 1fr)`;
            list.innerHTML = '';

            options.forEach(opt => {
                const card = createEl('div', 'card');
                card.style.backgroundColor = opt.color;
                card.innerHTML = `<div class="card__title">${opt.label}</div><div class="card__count">${counts[opt.type]} 次</div>`;
                card.addEventListener('click', () => openDataList(opt, dateStr));
                list.appendChild(card);
            });
        }

        /* ==================== 数据列表弹窗 ==================== */

        /**
         * 获取指定日期和类型的数据列表
         * @param {string} dateStr - 日期字符串（MM/DD格式）
         * @param {string} type - 记录类型
         * @returns {Array} 排序后的数据数组
         */
        function getDataByType(dateStr, type) {
            return values
                .filter(v => isDate(v.timestamp, dateStr) && v.type === type)
                .sort((a, b) => a.timestamp - b.timestamp);
        }

        /**
         * 打开数据列表弹窗
         * @param {Object} option - 选项配置对象
         * @param {string} dateStr - 日期字符串（MM/DD格式）
         */
        function openDataList(option, dateStr) {
            $('listModalTitle').textContent = `${option.label} - ${dateStr}`;
            const content = $('listModalContent');
            content.innerHTML = '';

            const dataList = getDataByType(dateStr, option.type);
            if (dataList.length === 0) {
                content.appendChild(createEl('div', 'list-empty', '暂无数据'));
                openModal('listModal');
                return;
            }

            const fields = option.options || [];
            dataList.forEach(item => {
                const row = createEl('div', 'list-item');
                row.appendChild(createEl('div', 'list-item__time', formatTime(item.timestamp)));

                const content = createEl('div', 'list-item__content');
                content.style.flex = '1';
                content.style.marginLeft = '10px';
                fields.forEach(f => {
                    if (f.key === 'img') {
                        if (item.img) {
                            const img = createEl('img', 'list-item__img');
                            img.src = item.img;
                            img.alt = option.label;
                            img.addEventListener('click', () => openImgViewer(item.img));
                            content.appendChild(img);
                        } else {
                            content.appendChild(createEl('div', 'list-item__empty', '暂无图片'));
                        }
                    } else {
                        const val = item[f.key];
                        const text = val ? `${val} ${f.label}` : '--';
                        content.appendChild(createEl('div', 'list-item__value', text));
                    }
                });

                row.appendChild(content);

                // 删除按钮
                const delBtn = createEl('button');
                delBtn.textContent = '删除';
                delBtn.style.cssText = 'background:none;border:none;color:#e74c3c;cursor:pointer;font-size:12px;padding:4px 8px;';
                delBtn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    if (!item.id) { showToast('记录ID缺失'); return; }
                    try {
                        await API.remove(item.id);
                        await refreshAll(dateStr);
                        openDataList(option, dateStr);
                        showToast('已删除');
                    } catch (err) {
                        showToast(err.message || '删除失败');
                    }
                });
                row.appendChild(delBtn);

                $('listModalContent').appendChild(row);
            });

            openModal('listModal');
        }

        $('listModalClose').addEventListener('click', () => closeModal('listModal'));
        $('listModal').addEventListener('click', e => { if (e.target.id === 'listModal') closeModal('listModal'); });

        /* ==================== 图片查看器 ==================== */

        /**
         * 重置图片查看器状态
         * @description 将缩放和偏移恢复到初始值
         */
        function resetViewer() {
            state.viewer.scale = 1;
            state.viewer.translateX = 0;
            state.viewer.translateY = 0;
            applyViewerTransform();
        }

        /**
         * 应用查看器变换
         * @description 根据当前状态更新图片的CSS变换
         */
        function applyViewerTransform() {
            const v = state.viewer;
            $('imgViewerImg').style.transform = `translate(${v.translateX}px, ${v.translateY}px) scale(${v.scale})`;
            $('imgViewerZoomLevel').textContent = `${Math.round(v.scale * 100)}%`;
        }

        /**
         * 打开图片查看器
         * @param {string} src - 图片URL地址
         */
        function openImgViewer(src) {
            $('imgViewerImg').src = src;
            resetViewer();
            openModal('imgViewer');
        }

        /**
         * 设置查看器缩放比例
         * @param {number} newScale - 新的缩放比例
         */
        function setViewerScale(newScale) {
            const v = state.viewer;
            v.scale = Math.max(viewer.minScale, Math.min(viewer.maxScale, newScale));
            if (v.scale <= 1) {
                v.translateX = 0;
                v.translateY = 0;
            }
            applyViewerTransform();
        }

        // 事件绑定
        $('imgViewerClose').addEventListener('click', () => closeModal('imgViewer'));
        $('zoomIn').addEventListener('click', () => setViewerScale(state.viewer.scale + viewer.scaleStep));
        $('zoomOut').addEventListener('click', () => setViewerScale(state.viewer.scale - viewer.scaleStep));
        $('zoomReset').addEventListener('click', resetViewer);

        // 滚轮缩放
        $('imgViewer').addEventListener('wheel', e => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -viewer.scaleStep : viewer.scaleStep;
            setViewerScale(state.viewer.scale + delta);
        });

        // 拖拽（仅在非双指模式下生效）
        $('imgViewerImg').addEventListener('pointerdown', e => {
            const v = state.viewer;
            if (v.isPinching) return;  // 双指缩放时禁用拖拽
            if (e.pointerType === 'touch' && e.isPrimary === false) return;
            v.isDragging = true;
            v.startX = e.clientX - v.translateX;
            v.startY = e.clientY - v.translateY;
            $('imgViewerImg').classList.add('dragging');
            $('imgViewerImg').setPointerCapture(e.pointerId);
        });

        $('imgViewerImg').addEventListener('pointermove', e => {
            const v = state.viewer;
            if (!v.isDragging) return;
            v.translateX = e.clientX - v.startX;
            v.translateY = e.clientY - v.startY;
            applyViewerTransform();
        });

        $('imgViewerImg').addEventListener('pointerup', () => {
            state.viewer.isDragging = false;
            $('imgViewerImg').classList.remove('dragging');
        });

        // 双指缩放
        $('imgViewer').addEventListener('touchstart', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const v = state.viewer;
                v.isPinching = true;  // 标记为双指模式
                v.isDragging = false;  // 禁用拖拽
                const [t1, t2] = [e.touches[0], e.touches[1]];
                v.pinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                v.pinchScale = v.scale;
            }
        });

        $('imgViewer').addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                e.preventDefault();
                const v = state.viewer;
                const [t1, t2] = [e.touches[0], e.touches[1]];
                const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                if (v.pinchDist > 0) {
                    setViewerScale(v.pinchScale * (dist / v.pinchDist));
                }
            }
        }, { passive: false });

        $('imgViewer').addEventListener('touchend', e => {
            const v = state.viewer;
            if (e.touches.length < 2) {
                v.pinchDist = 0;
                v.isPinching = false;  // 退出双指模式
            }
            // 如果还剩一个手指，可以重新开始拖拽
            if (e.touches.length === 1 && v.scale > 1) {
                v.isDragging = true;
                v.startX = e.touches[0].clientX - v.translateX;
                v.startY = e.touches[0].clientY - v.translateY;
            }
        });

        // 双击
        $('imgViewerImg').addEventListener('dblclick', () => {
            if (state.viewer.scale > 1.01) resetViewer();
            else setViewerScale(2);
        });

        $('imgViewer').addEventListener('click', e => {
            if (e.target.id === 'imgViewer') closeModal('imgViewer');
        });

        /* ==================== 输入弹窗 ==================== */

        /**
         * 创建数字输入字段（带单位后缀美化样式）
         * @param {Object} f - 字段配置对象
         * @param {string} f.label - 字段标签（作为单位后缀显示）
         * @param {string} f.key - 字段键名
         * @returns {HTMLElement} 表单字段元素
         */
        function createNumberField(f) {
            const wrap = createEl('div', 'form-field');

            // 输入框容器（带单位后缀）
            const inputContainer = createEl('div', 'input-with-unit');

            const input = createEl('input');
            input.type = 'number';
            input.min = '0';
            input.step = 'any';
            input.placeholder = `请输入数值`;
            input.dataset.key = f.key;

            // 单位后缀显示
            const unit = createEl('span', 'input-unit', f.label);

            inputContainer.appendChild(input);
            inputContainer.appendChild(unit);

            wrap.appendChild(inputContainer);
            return wrap;
        }

        /**
         * 创建图片上传字段（自定义美化样式）
         * @param {Object} f - 字段配置对象
         * @returns {HTMLElement} 表单字段元素
         */
        function createImageField(f) {
            const wrap = createEl('div', 'form-field');

            // 上传区域容器
            const uploadArea = createEl('div', 'upload-area');

            // 上传图标（使用SVG）
            const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            icon.setAttribute('class', 'upload-icon');
            icon.setAttribute('viewBox', '0 0 24 24');
            icon.setAttribute('fill', 'none');
            icon.setAttribute('stroke', 'currentColor');
            icon.setAttribute('stroke-width', '2');
            icon.setAttribute('stroke-linecap', 'round');
            icon.setAttribute('stroke-linejoin', 'round');
            icon.innerHTML = '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>';

            // 提示文字
            const text = createEl('div', 'upload-text', '点击上传图片');

            // 预览图片
            const preview = createEl('img', 'form-preview');

            // 文件输入（隐藏）
            const input = createEl('input');
            input.type = 'file';
            input.accept = 'image/*';

            // 组合上传区域
            uploadArea.appendChild(icon);
            uploadArea.appendChild(text);
            uploadArea.appendChild(preview);

            // 包裹上传区域和隐藏的input
            const wrapper = createEl('div', 'upload-wrapper');
            wrapper.appendChild(input);
            wrapper.appendChild(uploadArea);

            input.addEventListener('change', () => {
                const file = input.files[0];
                if (!file) return;
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
                uploadArea.classList.add('has-image');
                uploadArea.innerHTML = '';
                uploadArea.appendChild(preview);
            });

            wrap.appendChild(wrapper);
            return wrap;
        }

        /**
         * 打开输入弹窗
         * @param {Object} option - 选项配置对象
         */
        function openInputDialog(option) {
            state.currentOption = option;
            $('inputModalTitle').textContent = option.label;
            const body = $('inputModalBody');
            body.innerHTML = '';

            (option.options || []).forEach(f => {
                body.appendChild(f.key === 'img' ? createImageField(f) : createNumberField(f));
            });

            openModal('inputModal');
        }

        /**
         * 关闭输入弹窗
         */
        function closeInputDialog() {
            closeModal('inputModal');
            state.currentOption = null;
        }

        /**
         * 提交输入表单数据
         * @description 验证并保存用户输入的记录
         * @returns {Promise<void>}
         */
        async function submitInput() {
            const opt = state.currentOption;
            if (!opt) return;

            const record = { type: opt.type, ml: '', img: '', h: '', timestamp: Date.now() };

            for (const f of (opt.options || [])) {
                if (f.key === 'img') {
                    const fileInput = $('inputModalBody').querySelector('input[type="file"]');
                    if (fileInput && fileInput.files[0]) {
                        try {
                            record.img = await API.upload(fileInput.files[0]);
                        } catch (e) {
                            showToast(e.message || '图片上传失败');
                            return;
                        }
                    }
                } else {
                    const input = $('inputModalBody').querySelector(`input[data-key="${f.key}"]`);
                    record[f.key] = input ? input.value : '';
                }
            }

            try {
                await API.create(record);
                closeInputDialog();
                state.selectedDate = todayStr();
                await refreshAll();
                showToast(`已记录: ${opt.label}`);
            } catch (e) {
                showToast(e.message || '保存失败，请重试');
                console.error(e);
            }
        }

        $('inputModalCancel').addEventListener('click', closeInputDialog);
        $('inputModalConfirm').addEventListener('click', submitInput);

        /* ==================== 初始化 ==================== */

        /**
         * 应用初始化函数
         * @description 加载数据并渲染页面
         * @returns {Promise<void>}
         */
        async function init() {
            await loadData();
            renderDateTabs();
            renderCards();
            resize();
        }

        /**
         * 调整画布大小
         * @description 根据窗口尺寸重新设置画布并重绘
         */
        function resize() {
            const w = window.innerWidth;
            canvas.width = w;
            canvas.height = Math.round(w * CC.aspectRatio);
            state.centerX = canvas.width / 2;
            state.centerY = canvas.height;
            state.radius = canvas.width / 2;
            draw();
        }

        window.addEventListener('resize', resize);
        init();
    </script>
</body>

</html>
