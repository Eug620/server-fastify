<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/siam.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宝宝日常记录</title>

    <!-- FOUC 预防：在样式加载前立即设置主题 -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('baby-app-theme');
                var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
                var theme = saved || (prefersLight ? 'light' : 'dark');
                if (theme === 'light') {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            } catch (e) {}
        })();
    </script>

    <!-- 主题样式（CSS变量定义在外部主题文件中，始终加载） -->
    <link rel="stylesheet" href="/themes/dark.css">
    <link rel="stylesheet" href="/themes/light.css">
    <!-- 基础样式（布局、组件样式） -->
    <link rel="stylesheet" href="/app.css">
</head>

<body>
    <!-- 主题切换按钮（固定在顶部右侧） -->
    <button class="theme-toggle" id="themeToggle" title="切换主题">
        <!-- 太阳图标（暗色模式显示） -->
        <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- 月亮图标（亮色模式显示） -->
        <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
    </button>

    <div class="date-tabs" id="dateTabs">
        <div class="date-tabs__list" id="dateTabsList"></div>
    </div>
    <div class="card-list" id="cardList"></div>

    <div id="turntable-container"></div>
    <div class="toast" id="toast"></div>

    <!-- 输入弹窗 -->
    <div class="modal-mask" id="inputModal">
        <div class="modal">
            <div class="modal__title" id="inputModalTitle"></div>
            <div class="modal__body" id="inputModalBody"></div>
            <div class="modal__footer">
                <button class="btn-cancel" id="inputModalCancel">取消</button>
                <button class="btn-confirm" id="inputModalConfirm">确定</button>
            </div>
        </div>
    </div>

    <!-- 数据列表弹窗 -->
    <div class="modal-mask" id="listModal">
        <div class="modal list-modal">
            <div class="list-modal__header">
                <div class="list-modal__title" id="listModalTitle"></div>
                <button class="list-modal__close" id="listModalClose">×</button>
            </div>
            <div class="list-modal__content" id="listModalContent"></div>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="img-viewer" id="imgViewer">
        <button class="img-viewer__close" id="imgViewerClose">×</button>
        <img class="img-viewer__img" id="imgViewerImg" alt="预览图片">
        <div class="img-viewer__zoom-level" id="imgViewerZoomLevel">100%</div>
        <div class="img-viewer__zoom-controls">
            <button class="img-viewer__zoom-btn" id="zoomOut">−</button>
            <button class="img-viewer__zoom-btn" id="zoomReset">1:1</button>
            <button class="img-viewer__zoom-btn" id="zoomIn">+</button>
        </div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>

</html>
